<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דונם — מסמכים משפטיים</title>
<style>
  :root { color-scheme: light dark; --fg:#12151c; --muted:#5b6373; --bg:#fff; --line:#e3e6ec; --accent:#d92c4e; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8eaf0; --muted:#9aa3b5; --bg:#0b111c; --line:#232b3a; --accent:#ff6b85; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
         line-height:1.7; font-size:17px; display:flex; align-items:center; justify-content:center; }
  main { max-width:560px; padding:40px 22px; width:100%; }
  h1 { font-size:30px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:15px; margin:0 0 30px; }
  a.card { display:block; padding:18px 20px; border:1px solid var(--line); border-radius:12px;
           margin-bottom:12px; text-decoration:none; color:var(--fg); }
  a.card:hover { border-color:var(--accent); }
  a.card strong { display:block; font-size:18px; margin-bottom:2px; color:var(--accent); }
  a.card span { color:var(--muted); font-size:15px; }
  footer { margin-top:28px; color:var(--muted); font-size:14px; }
  footer a { color:var(--accent); }
</style>
<main>
  <h1>דונם</h1>
  <p class="sub">מסמכים משפטיים</p>

  <a class="card" href="terms.html">
    <strong>תנאי שימוש</strong>
    <span>הכללים, המשחק ההוגן, והבטיחות בשטח</span>
  </a>

  <a class="card" href="privacy.html">
    <strong>מדיניות פרטיות</strong>
    <span>איזה מידע נאסף, למה, ואיך מוחקים אותו</span>
  </a>

  <footer>
    רועי סלומון · <a href="mailto:DunamApp1@gmail.com">DunamApp1@gmail.com</a>
  </footer>
</main>
</html>
